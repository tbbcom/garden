<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title>Lawn fertilizing calendar by grass type</title>
<desc>When to fertilize: cool-season lawns get a light optional feeding in late April to May, the main feeding in early September and a winterizer in late October to November. Warm-season lawns are fed from April to August, with a last light feeding in September.</desc>
<rect width="1200" height="560" fill="#fff"/><rect width="1200" height="8" fill="#247b49"/>
<text x="60" y="76" font-size="38" font-weight="700" fill="#09090b">When to fertilize your lawn: month by month</text>
<text x="60" y="114" font-size="21" fill="#52525b">Typical schedule for the upper South and northern US; shift a few weeks for your climate</text><rect x="232" y="150" width="72.66666666666667" height="34" rx="6" fill="#fafafa"/><text x="268.3333333333333" y="173" font-size="17" font-weight="700" fill="#3f3f46" text-anchor="middle">Jan</text><line x1="230" y1="190" x2="230" y2="440" stroke="#f0f0f2" stroke-width="2"/><rect x="308.6666666666667" y="150" width="72.66666666666667" height="34" rx="6" fill="#f4f4f5"/><text x="345" y="173" font-size="17" font-weight="700" fill="#3f3f46" text-anchor="middle">Feb</text><line x1="306.6666666666667" y1="190" x2="306.6666666666667" y2="440" stroke="#f0f0f2" stroke-width="2"/><rect x="385.33333333333337" y="150" width="72.66666666666667" height="34" rx="6" fill="#fafafa"/><text x="421.6666666666667" y="173" font-size="17" font-weight="700" fill="#3f3f46" text-anchor="middle">Mar</text><line x1="383.33333333333337" y1="190" x2="383.33333333333337" y2="440" stroke="#f0f0f2" stroke-width="2"/><rect x="462" y="150" width="72.66666666666667" height="34" rx="6" fill="#f4f4f5"/><text x="498.3333333333333" y="173" font-size="17" font-weight="700" fill="#3f3f46" text-anchor="middle">Apr</text><line x1="460" y1="190" x2="460" y2="440" stroke="#f0f0f2" stroke-width="2"/><rect x="538.6666666666667" y="150" width="72.66666666666667" height="34" rx="6" fill="#fafafa"/><text x="575.0000000000001" y="173" font-size="17" font-weight="700" fill="#3f3f46" text-anchor="middle">May</text><line x1="536.6666666666667" y1="190" x2="536.6666666666667" y2="440" stroke="#f0f0f2" stroke-width="2"/><rect x="615.3333333333334" y="150" width="72.66666666666667" height="34" rx="6" fill="#f4f4f5"/><text x="651.6666666666667" y="173" font-size="17" font-weight="700" fill="#3f3f46" text-anchor="middle">Jun</text><line x1="613.3333333333334" y1="190" x2="613.3333333333334" y2="440" stroke="#f0f0f2" stroke-width="2"/><rect x="692" y="150" width="72.66666666666667" height="34" rx="6" fill="#fafafa"/><text x="728.3333333333334" y="173" font-size="17" font-weight="700" fill="#3f3f46" text-anchor="middle">Jul</text><line x1="690" y1="190" x2="690" y2="440" stroke="#f0f0f2" stroke-width="2"/><rect x="768.6666666666667" y="150" width="72.66666666666667" height="34" rx="6" fill="#f4f4f5"/><text x="805.0000000000001" y="173" font-size="17" font-weight="700" fill="#3f3f46" text-anchor="middle">Aug</text><line x1="766.6666666666667" y1="190" x2="766.6666666666667" y2="440" stroke="#f0f0f2" stroke-width="2"/><rect x="845.3333333333334" y="150" width="72.66666666666667" height="34" rx="6" fill="#fafafa"/><text x="881.6666666666667" y="173" font-size="17" font-weight="700" fill="#3f3f46" text-anchor="middle">Sep</text><line x1="843.3333333333334" y1="190" x2="843.3333333333334" y2="440" stroke="#f0f0f2" stroke-width="2"/><rect x="922" y="150" width="72.66666666666667" height="34" rx="6" fill="#f4f4f5"/><text x="958.3333333333334" y="173" font-size="17" font-weight="700" fill="#3f3f46" text-anchor="middle">Oct</text><line x1="920" y1="190" x2="920" y2="440" stroke="#f0f0f2" stroke-width="2"/><rect x="998.6666666666667" y="150" width="72.66666666666667" height="34" rx="6" fill="#fafafa"/><text x="1035" y="173" font-size="17" font-weight="700" fill="#3f3f46" text-anchor="middle">Nov</text><line x1="996.6666666666667" y1="190" x2="996.6666666666667" y2="440" stroke="#f0f0f2" stroke-width="2"/><rect x="1075.3333333333335" y="150" width="72.66666666666667" height="34" rx="6" fill="#f4f4f5"/><text x="1111.6666666666667" y="173" font-size="17" font-weight="700" fill="#3f3f46" text-anchor="middle">Dec</text><line x1="1073.3333333333335" y1="190" x2="1073.3333333333335" y2="440" stroke="#f0f0f2" stroke-width="2"/><text x="60" y="240" font-size="22" font-weight="700" fill="#09090b">Cool-season</text><text x="60" y="266" font-size="15" fill="#71717a">Fescue, bluegrass, ryegrass</text><rect x="511.83333333333337" y="216" width="99.5" height="44" rx="8" fill="#8cc79f"/><text x="561.5833333333334" y="284" font-size="15" font-weight="600" fill="#3f3f46" text-anchor="middle">Light, optional</text><rect x="845.3333333333334" y="216" width="45.83333333333337" height="44" rx="8" fill="#247b49"/><text x="868.25" y="284" font-size="15" font-weight="600" fill="#3f3f46" text-anchor="middle">Main feeding</text><rect x="971.8333333333334" y="216" width="99.50000000000011" height="44" rx="8" fill="#247b49"/><text x="1021.5833333333335" y="284" font-size="15" font-weight="600" fill="#3f3f46" text-anchor="middle">Winterizer</text><text x="60" y="360" font-size="22" font-weight="700" fill="#09090b">Warm-season</text><text x="60" y="386" font-size="15" fill="#71717a">Bermuda, zoysia, St. Augustine</text><rect x="462" y="336" width="149.33333333333337" height="44" rx="8" fill="#247b49"/><text x="536.6666666666667" y="404" font-size="15" font-weight="600" fill="#3f3f46" text-anchor="middle">1st</text><rect x="615.3333333333334" y="336" width="72.66666666666663" height="44" rx="8" fill="#247b49"/><text x="651.6666666666667" y="404" font-size="15" font-weight="600" fill="#3f3f46" text-anchor="middle">2nd</text><rect x="692" y="336" width="149.33333333333337" height="44" rx="8" fill="#8cc79f"/><text x="766.6666666666667" y="404" font-size="15" font-weight="600" fill="#3f3f46" text-anchor="middle">3rd (skip in drought)</text><rect x="845.3333333333334" y="336" width="72.66666666666663" height="44" rx="8" fill="#8cc79f"/><text x="881.6666666666667" y="404" font-size="15" font-weight="600" fill="#3f3f46" text-anchor="middle">Last, light</text><rect x="60" y="470" width="24" height="24" rx="5" fill="#247b49"/><text x="94" y="488" font-size="17" fill="#3f3f46">Main feeding (about 1 lb nitrogen per 1,000 sq ft)</text>
<rect x="560" y="470" width="24" height="24" rx="5" fill="#8cc79f"/><text x="594" y="488" font-size="17" fill="#3f3f46">Light or optional (0.5 lb or less)</text>
<text x="60" y="536" font-size="15" fill="#71717a">Stop warm-season feeding about 6 weeks before your first frost. Find it by ZIP: homegardenlot.com/frost-dates/</text>
<text x="1140" y="536" font-size="16" font-weight="700" fill="#247b49" text-anchor="end">Home Garden Lot</text></svg>
