<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title>Garlic planting dates by USDA zone</title>
<desc>Fall garlic planting windows by USDA hardiness zone 3 to 10, from mid-September in zone 3 to late January in zone 10, based on typical first frost dates.</desc>
<defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#247b49"/><rect width="4" height="10" fill="#5fae7d"/></pattern></defs>
<rect width="1200" height="800" fill="#ffffff"/>
<rect width="1200" height="8" fill="#247b49"/>
<text x="60" y="78" font-size="40" font-weight="700" fill="#09090b">When to plant garlic: dates by USDA zone</text>
<text x="60" y="118" font-size="22" fill="#52525b">Fall planting windows, from your first frost to about 4 weeks later</text>
<line x1="150.0" y1="170" x2="150.0" y2="656" stroke="#e4e4e7" stroke-width="2"/><text x="247.1" y="160" font-size="20" font-weight="700" fill="#3f3f46" text-anchor="middle">Sep</text><line x1="344.1" y1="170" x2="344.1" y2="656" stroke="#e4e4e7" stroke-width="2"/><text x="441.2" y="160" font-size="20" font-weight="700" fill="#3f3f46" text-anchor="middle">Oct</text><line x1="544.7" y1="170" x2="544.7" y2="656" stroke="#e4e4e7" stroke-width="2"/><text x="641.8" y="160" font-size="20" font-weight="700" fill="#3f3f46" text-anchor="middle">Nov</text><line x1="738.8" y1="170" x2="738.8" y2="656" stroke="#e4e4e7" stroke-width="2"/><text x="835.9" y="160" font-size="20" font-weight="700" fill="#3f3f46" text-anchor="middle">Dec</text><line x1="939.4" y1="170" x2="939.4" y2="656" stroke="#e4e4e7" stroke-width="2"/><text x="1036.5" y="160" font-size="20" font-weight="700" fill="#3f3f46" text-anchor="middle">Jan</text><line x1="1140.0" y1="170" x2="1140.0" y2="656" stroke="#e4e4e7" stroke-width="2"/><text x="126" y="230" font-size="22" font-weight="700" fill="#09090b" text-anchor="end">Zone 3</text><rect x="240.6" y="206" width="135.9" height="36" rx="8" fill="#6b3f8f"/><text x="388.5" y="231" font-size="18" font-weight="600" fill="#3f3f46" text-anchor="start">Sep 15 – Oct 6</text><text x="126" y="288" font-size="22" font-weight="700" fill="#09090b" text-anchor="end">Zone 4</text><rect x="337.6" y="264" width="135.9" height="36" rx="8" fill="#6b3f8f"/><text x="485.5" y="289" font-size="18" font-weight="600" fill="#3f3f46" text-anchor="start">Sep 30 – Oct 21</text><text x="126" y="346" font-size="22" font-weight="700" fill="#09090b" text-anchor="end">Zone 5</text><rect x="402.4" y="322" width="135.9" height="36" rx="8" fill="#6b3f8f"/><text x="550.2" y="347" font-size="18" font-weight="600" fill="#3f3f46" text-anchor="start">Oct 10 – Oct 31</text><text x="126" y="404" font-size="22" font-weight="700" fill="#09090b" text-anchor="end">Zone 6</text><rect x="467.1" y="380" width="181.2" height="36" rx="8" fill="#2f6f7a"/><text x="660.2" y="405" font-size="18" font-weight="600" fill="#3f3f46" text-anchor="start">Oct 20 – Nov 17</text><text x="126" y="462" font-size="22" font-weight="700" fill="#09090b" text-anchor="end">Zone 7</text><rect x="544.7" y="438" width="181.2" height="36" rx="8" fill="#2f6f7a"/><text x="737.9" y="463" font-size="18" font-weight="600" fill="#3f3f46" text-anchor="start">Nov 1 – Nov 29</text><text x="126" y="520" font-size="22" font-weight="700" fill="#09090b" text-anchor="end">Zone 8</text><rect x="635.3" y="496" width="181.2" height="36" rx="8" fill="#247b49"/><text x="828.5" y="521" font-size="18" font-weight="600" fill="#3f3f46" text-anchor="start">Nov 15 – Dec 13</text><text x="126" y="578" font-size="22" font-weight="700" fill="#09090b" text-anchor="end">Zone 9</text><rect x="738.8" y="554" width="291.2" height="36" rx="8" fill="url(#hatch)"/><text x="884.4" y="579" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">Dec 1 – mid-Jan</text><text x="126" y="636" font-size="22" font-weight="700" fill="#09090b" text-anchor="end">Zone 10</text><rect x="861.8" y="612" width="232.9" height="36" rx="8" fill="url(#hatch)"/><text x="978.2" y="637" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">Dec 20 – late Jan</text><rect x="60" y="680" width="24" height="24" rx="5" fill="#6b3f8f"/><text x="94" y="698" font-size="18" fill="#3f3f46">Hardneck</text><rect x="200.8" y="680" width="24" height="24" rx="5" fill="#2f6f7a"/><text x="234.8" y="698" font-size="18" fill="#3f3f46">Hardneck or softneck</text><rect x="456.8" y="680" width="24" height="24" rx="5" fill="#247b49"/><text x="490.8" y="698" font-size="18" fill="#3f3f46">Softneck</text><rect x="597.6" y="680" width="24" height="24" rx="5" fill="url(#hatch)"/><text x="631.6" y="698" font-size="18" fill="#3f3f46">Softneck, pre-chill cloves 4–8 weeks</text><text x="60" y="772" font-size="17" fill="#71717a">Estimates from typical first-frost dates. Find your exact date by ZIP: homegardenlot.com/frost-dates/</text>
<text x="1140" y="772" font-size="17" font-weight="700" fill="#247b49" text-anchor="end">Home Garden Lot</text>
</svg>
