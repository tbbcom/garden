name: Site audit

# Read-only weekly check of the live blog (SEO, web standards, AdSense readiness).
# Never changes Blogger; writes reports/site-audit.md and the run summary.
on:
  schedule:
    - cron: '17 2 * * 1' # Mondays 10:17 Malaysia time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Audit live site
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: node scripts/blogger-audit.mjs

      - name: Save report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/site-audit.md
          git diff --cached --quiet || { git commit -m "Site audit $(date -u +%F) [skip ci]" && git push; }
