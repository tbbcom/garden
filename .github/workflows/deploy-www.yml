name: Deploy www

# Builds the static www.homegardenlot.com (blog from site/content + tools from tbbcom/garden-calc)
# and publishes it to GitHub Pages. Until the repository variable WWW_LIVE is "1", every page is
# noindex and robots.txt blocks crawling, so the preview host can't compete with the live Blogger site.
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/site/**', 'blogger/homegardenlot-theme.xml', 'package*.json', '.github/workflows/deploy-www.yml']
  schedule:
    - cron: '41 */6 * * *' # picks up tool changes from garden-calc
  workflow_dispatch:
    inputs:
      apply_redirects:
        description: 'Switch-over: create the Cloudflare 301 rules (needs CF_API_TOKEN and CF_ZONE_ID)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-www
  cancel-in-progress: false

env:
  LIVE: ${{ vars.WWW_LIVE == '1' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: tbbcom/garden-calc
          path: calc
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Build tools (garden-calc)
        working-directory: calc
        env:
          GTM_ID: ${{ vars.GTM_ID || secrets.GTM_ID }}
        run: node scripts/build-site.mjs
      - name: Live page hashes (for IndexNow)
        if: env.LIVE == 'true'
        run: curl -fsSL --retry 2 https://www.homegardenlot.com/page-hashes.json -o /tmp/old-hashes.json || echo '{}' > /tmp/old-hashes.json
      - run: npm ci
      - name: Build site
        env:
          TOOLS_DIR: calc/_site
          PREVIEW: ${{ env.LIVE == 'true' && '0' || '1' }}
          GTM_ID: ${{ vars.GTM_ID || secrets.GTM_ID }}
          WEB3FORMS_KEY: ${{ vars.WEB3FORMS_KEY }}
        run: node scripts/site/build.mjs
      - name: Check links and SEO basics
        run: node scripts/site/check.mjs
      - name: Find changed pages
        id: diff
        if: env.LIVE == 'true'
        run: |
          node -e "
            const o = JSON.parse(require('fs').readFileSync('/tmp/old-hashes.json','utf8') || '{}');
            const n = JSON.parse(require('fs').readFileSync('_site/page-hashes.json','utf8'));
            const c = Object.keys(n).filter((u) => o[u] !== n[u]).slice(0, 10000);
            require('fs').writeFileSync('/tmp/changed.json', JSON.stringify(c));
            console.log(c.length + ' changed page(s)');
          "
          echo "changed=$(cat /tmp/changed.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4

  redirects:
    needs: deploy
    if: github.event_name == 'workflow_dispatch' && inputs.apply_redirects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Create Cloudflare redirect rules
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: node scripts/site/cloudflare-rules.mjs

  indexnow:
    needs: [build, deploy]
    if: vars.WWW_LIVE == '1' && needs.build.outputs.changed != '[]' && needs.build.outputs.changed != ''
    runs-on: ubuntu-latest
    steps:
      - name: Purge Cloudflare cache
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then echo "No Cloudflare secrets; skipping purge."; exit 0; fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" --data '{"purge_everything":true}' >/dev/null && echo "Cache purged."
      - name: Submit changed pages to IndexNow
        env:
          CHANGED: ${{ needs.build.outputs.changed }}
        run: |
          node -e "
            const urls = JSON.parse(process.env.CHANGED);
            const key = 'f6b36fd77837445fcaa6cfad74c7ace4';
            fetch('https://api.indexnow.org/indexnow', { method: 'POST', headers: { 'Content-Type': 'application/json; charset=utf-8' },
              body: JSON.stringify({ host: 'www.homegardenlot.com', key, keyLocation: 'https://www.homegardenlot.com/' + key + '.txt', urlList: urls }) })
              .then((r) => { console.log('IndexNow HTTP ' + r.status + ' for ' + urls.length + ' URL(s)'); if (r.status >= 400) process.exit(1); });
          "
